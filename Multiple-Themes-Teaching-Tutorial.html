<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple Themes • Florida Standards Sprints</title><style>
:root{--ink:#173f49;--teal:#087f8c;--sand:#fff4d8}*{box-sizing:border-box}body{margin:0;background:#edf8f7;color:var(--ink);font:18px/1.6 system-ui,sans-serif}header{background:#173f49;color:white;padding:24px max(20px,calc((100vw - 1000px)/2));}h1{font-size:clamp(26px,5vw,40px);margin:6px 0}header p{margin:4px 0}main{max-width:1000px;margin:22px auto;padding:0 18px}.panel{background:white;border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 30px #173f4910}h2{line-height:1.25}button{font:inherit;background:var(--teal);color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #dc9a1a;outline-offset:3px}input,textarea{font:inherit}input[type=text],input:not([type]),textarea{width:100%;padding:10px;border:2px solid #9cbfc3;border-radius:8px}textarea{display:block;margin:8px 0 18px;min-height:110px}label.writing{display:block;font-weight:600;margin:18px 0}.callout{background:var(--sand);border-left:5px solid #e2aa37;padding:18px;margin:20px 0}.passage{background:#f2f8fa;border:1px solid #b8d7dc;padding:22px;border-radius:12px;margin:20px 0}.question{border-top:2px solid #d7e9eb;margin-top:25px;padding-top:20px}.badge{font-size:14px;font-weight:bold;color:#086875}.option{display:block;padding:12px;border:1px solid #bdd8da;border-radius:8px;margin:8px 0;cursor:pointer}.option:has(input:checked){background:#d7f1ef;border-color:var(--teal)}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--teal)}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:12px;text-align:left;vertical-align:top;border:1px solid #b9d5d7}th{background:#dff2f1}.feedback{background:#edf6f2;padding:12px;display:none}nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}nav button{font-size:14px;margin:0;background:#45656c}nav button.current{background:#087f8c}progress{width:100%;height:12px;accent-color:#e8b745}.footer{display:flex;justify-content:space-between;margin:14px 0}details{margin:16px 0;border:1px solid #bed6d9;padding:14px;border-radius:8px}summary{cursor:pointer;font-weight:bold}.muted{font-size:14px}#report{white-space:pre-wrap;background:#fff8e8;padding:20px;margin-top:20px;overflow-wrap:anywhere}#report:empty{display:none}@media(max-width:600px){td,th{padding:7px;font-size:14px}.panel{padding:18px}.passage{padding:14px}}@media print{body{background:white;font-size:12pt}header,nav,.footer,#teacher,.panel>*{display:none!important}.panel #report{display:block!important;white-space:pre-wrap;background:white;padding:0}.panel{box-shadow:none;padding:0}main{margin:0;max-width:none}#report{border:0}}
</style></head><body><header><p>🌊 FLORIDA STANDARDS SPRINTS • ELA.6.R.1.2</p><h1>Multiple Themes: Find the Messages</h1><p>Topic → clues → theme → development → connection</p><progress id="progress" max="8" value="1"></progress></header><main><nav id="nav" aria-label="Lesson sections"></nav><article id="panel" class="panel"></article><div class="footer"><button id="back">← Back</button><button id="next">Next →</button></div></main><script>
const sections=[{"title": "Your mission", "time": 2, "body": "<h2>One story. More than one message.</h2><p>You will learn to discover <b>multiple themes</b> and explain how an author develops them. Plan for <b>43 minutes</b>: read, pause, answer, and explain. The timer is a guide, not a race.</p><div class=\"callout\"><b>I can\u2026</b><ul><li>Distinguish a topic, a plot summary, and a theme.</li><li>Identify explicit (stated) and implied themes.</li><li>Use setting, conflict, actions, dialogue, and character changes as evidence.</li><li>Trace two themes through the beginning, middle, and ending.</li><li>Explain how two themes connect, using evidence and reasoning.</li></ul></div><p><b>ELA.6.R.1.2:</b> Analyze the development of stated or implied theme(s) throughout a literary text.</p><label>Your name <input id=\"student\" placeholder=\"First and last name\"></label><p>Complete each screen in order. Review feedback even when you are correct. At the end, save your completion report and submit it in Canvas as directed by Mrs. Rees.</p>"}, {"title": "Topic \u2260 theme", "time": 5, "body": "<h2>Topic names the subject. Theme explains the message.</h2><table><tr><th>Kind</th><th>Example</th><th>What it does</th></tr><tr><td>Topic</td><td>Trust</td><td>Names a broad subject, often in one or two words.</td></tr><tr><td>Plot summary</td><td>A girl admits she broke her friend\u2019s model.</td><td>Tells what happens to particular characters.</td></tr><tr><td>Theme</td><td>Honesty can rebuild trust even when admitting the truth is difficult.</td><td>Expresses a complete message about life or people.</td></tr></table><p>A theme is supported by the story. It is not simply your favorite advice. Avoid character names and narrow event details when stating a theme. Use <b>can, may, or often</b> when the evidence does not support words such as always or never.</p><div class=\"callout\"><b>Memory line: Topic = WHAT. Theme = SO WHAT?</b><p>Topic: courage \u2192 What does the story suggest about courage? \u2192 Courage can mean admitting that you need help.</p></div><p>A universal theme can apply across different places and times, such as the value of belonging. Not every theme is a command or a neatly stated moral; a story may reveal an insight about people.</p><div class=\"question\" data-id=\"q1\" data-answer=\"2\" data-why=\"The complete statement expresses a transferable message. Friendship alone is a topic; Nora\u2019s action is a plot detail.\"><span class=\"badge\">DOK 1 \u2022 Select one</span><h3>Which statement is a theme?</h3><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"0\"> Friendship</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"1\"> Nora helps Ben fix a bicycle.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"2\"> Friendship can grow when people make time to help each other.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"3\"> The bicycle is blue.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q2\" data-answer=\"3\" data-why=\"The message is a complete thought and avoids claiming that failure guarantees success.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>Which revision turns the topic \u201cfailure\u201d into a well-qualified theme?</h3><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"0\"> Failure always makes everyone successful.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"1\"> A runner loses the final race.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"2\"> Failure</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"3\"> Learning from mistakes can help people improve.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Explicit & implied", "time": 5, "body": "<h2>Some messages are stated. Others must be inferred.</h2><p><b>Explicit theme:</b> the message is directly stated by a narrator or character, and the events support it. <b>Implied theme:</b> the message is suggested through details; the author does not state that message directly.</p><div class=\"passage\"><b>Mini-story A</b><p>Jules hid her tangled kite string. When she finally asked for help, her cousin showed her how to loosen the knots. Together they launched the kite. Jules thought, \u201cAsking for help can make a difficult task possible.\u201d</p></div><p>The final thought explicitly states a message supported by the action.</p><div class=\"passage\"><b>Mini-story B</b><p>Amir pushed the same crooked shelf into place three times. He paused at his sister\u2019s doorway, then knocked. She held one end while he tightened the screws. That evening, two mugs rested on the level shelf.</p></div><p>The message that accepting help can solve a difficult problem is <b>implied</b>. We infer it from Amir\u2019s failed attempts, his decision to ask, and the successful result.</p><p><b>Important:</b> dialogue is not automatically a theme. A character might say something selfish or mistaken. Test the statement against the whole story. A single story may contain both an explicit theme and a different implied theme.</p><div class=\"question\" data-id=\"q3\" data-answer=\"1\" data-why=\"Amir\u2019s change and the shared success allow a supported inference; the theme is not directly announced.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>Why is the theme of Mini-story B implied?</h3><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"0\"> There is no dialogue, so it has no theme.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"1\"> Actions and the outcome suggest the message without directly stating it.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"2\"> Any last sentence is an explicit theme.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"3\"> The story is about shelves.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q4\" data-answer=\"2\" data-why=\"The consequences challenge the character\u2019s belief. A quotation is evidence, but the whole story determines the supported message.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>A character says, \u201cWinning is all that matters,\u201d then cheats and loses every friend. What should a reader do?</h3><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"0\"> Accept the quotation as the theme.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"1\"> Ignore the ending.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"2\"> Use the consequences to test whether the story supports or challenges the statement.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"3\"> Conclude that themes cannot appear in dialogue.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Your theme detective toolkit", "time": 4, "body": "<h2>Use SCARS to remember what to examine.</h2><div class=\"callout\"><b>S</b>etting \u2022 <b>C</b>onflict \u2022 <b>A</b>ctions and words \u2022 <b>R</b>esolution \u2022 <b>S</b>hift in the character</div><table><tr><th>Ask yourself</th><th>Connect the answer to a message</th></tr><tr><td>What is the setting like? How does it affect the characters?</td><td>Consider pressure, limitations, opportunities, and expectations. A place alone is not a theme.</td></tr><tr><td>What conflicts do the characters face?</td><td>Look for external problems and internal struggles: fear, pride, loyalty, or guilt.</td></tr><tr><td>What do characters say and do?</td><td>Compare beliefs with choices. Watch for repeated decisions or contrasts.</td></tr><tr><td>How do the conflicts end?</td><td>Ask which choices succeed, fail, or have unexpected consequences. An unresolved ending can still develop a theme.</td></tr><tr><td>Do characters change? How?</td><td>Compare the character\u2019s beginning and ending beliefs or behavior.</td></tr><tr><td>Do characters learn a lesson? What is it?</td><td>Turn a specific lesson into a message that can apply beyond this character. A character may fail to learn while readers learn from the consequences.</td></tr></table><p><b>Evidence \u2192 reasoning:</b> Don\u2019t stop at \u201cThis shows teamwork.\u201d Explain: \u201cBy accepting a partner\u2019s idea after working alone fails, the character shows that cooperation can solve problems individual effort cannot.\u201d</p><p><b>Development means movement:</b> Beginning introduces a belief or problem \u2192 middle tests it through choices \u2192 ending confirms, complicates, or challenges a message.</p><label class=\"writing\">Practice remembering: Without copying, write what SCARS stands for. Then explain which part helps you compare a character before and after a conflict.<textarea id=\"toolkit\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label>"}, {"title": "Watch the analysis: The Courtyard", "time": 7, "body": "<div class=\"passage\"><h3>The Courtyard \u2022 Original story</h3><p><b>[1]</b> The community center\u2019s courtyard had been dry for six weeks. Water restrictions allowed volunteers to use only two barrels of collected rainwater each Saturday. Lila, who had proposed a garden to welcome new neighbors, had drawn rows of identical flowering plants. On her sketch, the courtyard already looked ready for a photograph.</p><p><b>[2]</b> At the first meeting, Mateo suggested native plants and a shaded reading bench. \u201cSome of those flowers need more water than we have,\u201d he said. Lila tapped her drawing. \u201cIf we all follow one plan, we can finish by Saturday.\u201d She assigned Mateo the job of painting signs and kept the planting decisions for herself.</p><p><b>[3]</b> By noon on Saturday, several flowers drooped. Lila tipped the last bucket over one row. Another volunteer pointed to the empty barrel. Mateo stood beside his untouched sign. \u201cI wanted to help make the garden work,\u201d he said quietly, \u201cnot just label it.\u201d Lila started to explain how long her drawing had taken, but stopped. The paper had not needed water. The plants did.</p><p><b>[4]</b> That afternoon, Lila invited everyone to change the sketch. Mateo explained how native plants could survive with less water. A younger child suggested putting the bench where a wall cast afternoon shade. Lila wrote their names beside the changes. She still worried that visitors would notice the empty spaces between the new plants.</p><p><b>[5]</b> A week later, the native plants stood upright, but the courtyard did not look like Lila\u2019s photograph. Three neighbors sat on the shaded bench, trading stories while a child watered one small bed. Lila slid her original drawing beneath the supply box. When a new volunteer arrived, she handed him a pencil instead of a list of jobs.</p><p><b>[6]</b> \u201cA shared project becomes stronger when everyone\u2019s ideas have room to grow,\u201d Lila told him. Then she pulled up another chair.</p></div><h2>Think along with the model</h2><p><b>Setting:</b> drought and limited water make Lila\u2019s rigid plan impractical. The conditions force the group to reconsider what a successful garden needs.</p><p><b>Conflicts:</b> plants struggle with limited water (external), while Lila struggles to give up control and a perfect-looking result (internal).</p><p><b>Words and actions:</b> assigning Mateo only signs excludes his expertise. Inviting revisions and handing a new volunteer a pencil show a change toward shared decision-making.</p><p><b>Resolution and shift:</b> the plants survive and neighbors use the bench. Lila values a useful shared space more than matching her original picture.</p><table><tr><th>Theme</th><th>Beginning \u2192 middle \u2192 ending</th></tr><tr><td>Explicit: Shared projects become stronger when everyone\u2019s ideas are included.</td><td>Lila controls decisions [2] \u2192 the plan struggles and she invites input [3\u20134] \u2192 the community benefits and she states the message [5\u20136].</td></tr><tr><td>Implied: Adapting expectations can lead to meaningful success.</td><td>Lila wants a photograph-perfect garden [1] \u2192 reality forces revision [3\u20134] \u2192 the imperfect-looking garden serves people [5].</td></tr></table><p><b>How the themes connect:</b> Listening to others helps Lila adapt her idea of success. The themes overlap but are different: one concerns including people; the other concerns changing expectations.</p><div class=\"question\" data-id=\"q5\" data-answer=\"2\" data-why=\"The contrast traces Lila\u2019s shift from appearance to usefulness, developing the theme rather than merely naming a setting detail.\"><span class=\"badge\">DOK 3 \u2022 Select one</span><h3>Which detail best develops the implied theme about changing expectations?</h3><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"0\"> The courtyard is at a community center.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"1\"> Lila\u2019s first sketch has rows.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"2\"> Lila worries about empty spaces, but later values neighbors enjoying the bench.</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"3\"> The new volunteer arrives.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Your turn: Explain how the water restrictions help develop BOTH themes. Use one detail from the middle and one from the ending.<textarea id=\"guided\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label>"}, {"title": "Independent FAST-style practice", "time": 11, "body": "<p>Read the whole story first. Then reread the numbered paragraphs for evidence. These are original practice items inspired by FAST formats, not official test questions. Check answers after you have committed to your choices.</p><div class=\"passage\"><h3>Room for the Ramp \u2022 Original story</h3><p><b>[1]</b> On the afternoon of the harbor festival, rain rattled the windows of the old ferry station. The outdoor stage was closed, so the student exhibit moved into a narrow waiting room. A painted wooden boat, built by twelve-year-old Owen and his friend Priya, rested on a table near the door. The exhibit prize included a summer workshop Owen\u2019s family could not afford.</p><p><b>[2]</b> Owen had shaped the hull, measured each plank, and polished the nameplate until his fingers ached. Priya had designed a removable ramp after interviewing a neighbor who used a wheelchair. Owen thought the ramp spoiled the boat\u2019s sleek outline. On the entry card he wrote, \u201cDesigner and builder: Owen Reed.\u201d When Priya asked where her name belonged, he said, \u201cThe judges care about the boat, not the paperwork.\u201d</p><p><b>[3]</b> As visitors crowded into the station, a child leaned against the table. The boat slid; its display base cracked. Owen grabbed the hull before it hit the floor, but the boat now tilted sharply. He pushed folded entry cards beneath it. Each time someone walked past, the cards slipped. Across the room, the judges began examining the exhibits.</p><p><b>[4]</b> Priya opened her tool bag. \u201cThe ramp pieces can brace the base,\u201d she said. Owen pictured the judges seeing an awkward patch on his polished work. \u201cThey\u2019ll think I didn\u2019t plan carefully.\u201d Priya set the pieces beside him. \u201cYou can keep the perfect outline, or we can keep it standing.\u201d Then she waited. She did not take the boat from him.</p><p><b>[5]</b> Owen reached for a clamp. While Priya held the base, he fastened two supports beneath it. Their repair worked, but the ramp\u2019s empty mounting holes remained visible. A visitor asked why the boat had holes along one side. Before Owen could describe them as unfinished details, Priya explained how the removable ramp allowed more passengers to board. The visitor nodded. \u201cMy brother would need that.\u201d</p><p><b>[6]</b> When a judge reached their table, Owen turned the boat so the holes faced forward. He explained the repair and then pointed to Priya. \u201cShe designed the ramp. I wanted it hidden because it changed the shape, but it changes who can use the boat.\u201d He crossed out the entry card\u2019s first line and wrote both names. Priya stood beside him as he described their next revision.</p><p><b>[7]</b> The judges awarded the workshop to another exhibit. Owen folded the results sheet into his pocket. Outside, the rain had stopped. \u201cWe could test the ramp with Mr. Ellis tomorrow,\u201d he said. Priya looked at the boat and handed him the other end of its base. Together they carried it through the doorway.</p></div><div class=\"question\" data-id=\"q6\" data-answer=\"0,1\" data-why=\"Owen shares credit and values the ramp\u2019s usefulness. His continued work after losing supports a broader meaning of success. The other statements are unsupported or contradicted.\"><span class=\"badge\">DOK 3 \u2022 Select 2</span><h3>Which TWO themes are developed throughout the story?</h3><label class=\"option\"><input type=\"checkbox\" name=\"q6\" value=\"0\"> Recognizing others\u2019 contributions can improve both relationships and shared work.</label><label class=\"option\"><input type=\"checkbox\" name=\"q6\" value=\"1\"> Real success can involve learning and inclusion rather than winning recognition.</label><label class=\"option\"><input type=\"checkbox\" name=\"q6\" value=\"2\"> Rain always ruins carefully planned projects.</label><label class=\"option\"><input type=\"checkbox\" name=\"q6\" value=\"3\"> A perfect appearance matters more than usefulness.</label><label class=\"option\"><input type=\"checkbox\" name=\"q6\" value=\"4\"> Every mistake guarantees a prize.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q7\" data-answer=\"0\" data-why=\"The forced move and crowd cause the base to crack, creating a situation in which Owen needs and eventually acknowledges Priya\u2019s expertise.\"><span class=\"badge\">DOK 3 \u2022 Select one</span><h3>Part A: How does the festival setting help develop the theme about recognizing contributions?</h3><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"0\"> The crowded indoor space creates a problem that makes Priya\u2019s practical ideas important.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"1\"> The ferry station proves Owen has built a full-size boat.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"2\"> The rain makes the judges give every student a prize.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"3\"> The festival makes Owen and Priya strangers.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q8\" data-answer=\"0,1\" data-why=\"The first excerpt shows the setting causing the problem; the second shows the contribution that addresses it. Together they connect environment, conflict, and collaboration.\"><span class=\"badge\">DOK 3 \u2022 Select 2</span><h3>Part B: Select TWO excerpts that best support the setting-to-theme connection in Part A.</h3><label class=\"option\"><input type=\"checkbox\" name=\"q8\" value=\"0\"> \u201cAs visitors crowded into the station, a child leaned against the table.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q8\" value=\"1\"> \u201cThe ramp pieces can brace the base,\u201d she said.</label><label class=\"option\"><input type=\"checkbox\" name=\"q8\" value=\"2\"> \u201cOwen had shaped the hull, measured each plank\u2026\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q8\" value=\"3\"> \u201cOutside, the rain had stopped.\u201d</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q9\" data-answer=\"1\" data-why=\"His missing credit, reluctance to repair, and effort to hide the ramp all reveal pride competing with fairness and usefulness.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>What internal conflict most strongly shapes Owen\u2019s choices?</h3><label class=\"option\"><input type=\"radio\" name=\"q9\" value=\"0\"> He must decide whether to travel by ferry.</label><label class=\"option\"><input type=\"radio\" name=\"q9\" value=\"1\"> He wants recognition and a flawless appearance but must confront the value of Priya\u2019s work.</label><label class=\"option\"><input type=\"radio\" name=\"q9\" value=\"2\"> He fears rain will permanently close the harbor.</label><label class=\"option\"><input type=\"radio\" name=\"q9\" value=\"3\"> He wants Priya to compete against another exhibit.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q10\" data-answer=\"2,3\" data-why=\"Sharing credit reverses his earlier exclusion, and planning a useful test after losing reveals a new purpose beyond winning.\"><span class=\"badge\">DOK 3 \u2022 Select 2</span><h3>Select TWO sentences that most clearly reveal Owen\u2019s change. (Selectable-text practice)</h3><label class=\"option\"><input type=\"checkbox\" name=\"q10\" value=\"0\"> \u201cOn the entry card he wrote, \u2018Designer and builder: Owen Reed.\u2019\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q10\" value=\"1\"> \u201cHe pushed folded entry cards beneath it.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q10\" value=\"2\"> \u201cHe crossed out the entry card\u2019s first line and wrote both names.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q10\" value=\"3\"> \u201cWe could test the ramp with Mr. Ellis tomorrow,\u201d he said.</label><label class=\"option\"><input type=\"checkbox\" name=\"q10\" value=\"4\"> \u201cThe exhibit prize included a summer workshop\u2026\u201d</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q11\" data-answer=\"3\" data-why=\"Losing remains disappointing, but his plan to test the ramp shows that learning and inclusion have become meaningful measures of success.\"><span class=\"badge\">DOK 3 \u2022 Select one</span><h3>How does the ending develop the theme about success?</h3><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"0\"> It proves Owen never cared about the workshop.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"1\"> It leaves Owen exactly as he was at the beginning.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"2\"> It shows Owen giving up because the judges were unfair.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"3\"> It shows Owen continuing purposeful work despite not earning the prize.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q12\" data-answer=\"1\" data-why=\"Acknowledging Priya\u2019s ideas leads Owen to reconsider what makes the model successful; the themes connect without being interchangeable.\"><span class=\"badge\">DOK 3 \u2022 Select one</span><h3>Which explanation best describes the relationship between the two themes?</h3><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"0\"> They contradict each other because teamwork guarantees awards.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"1\"> By recognizing Priya\u2019s contribution, Owen begins to value a useful design over individual recognition.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"2\"> They are identical because both can be labeled friendship.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"3\"> They are unrelated because only the weather matters.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q13\" data-answer=\"1\" data-why=\"No narrator or character directly states this general message. The reader infers it from the pattern of decisions and the ending.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>Is \u201cReal success can involve learning and inclusion rather than winning recognition\u201d explicit or implied in this story?</h3><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"0\"> Explicit, because the narrator states those exact ideas as a general message.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"1\"> Implied, because Owen\u2019s decisions and continued work suggest the message.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"2\"> Explicit, because any dialogue directly states a theme.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"3\"> Neither, because a story must end with a prize to have a theme.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q14\" data-answer=\"2\" data-why=\"His purposeful action after the prize is unavailable contradicts the claim that winning is his only motive.\"><span class=\"badge\">DOK 3 \u2022 Select one</span><h3>Which evidence most strongly challenges the claim \u201cOwen only changes so that he can win\u201d?</h3><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"0\"> He polishes the nameplate before the festival.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"1\"> He worries that the repair looks awkward.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"2\"> After losing, he proposes testing the ramp with a person who could use it.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"3\"> The judges examine exhibits in the waiting room.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "Explain two themes", "time": 6, "body": "<h2>Build an explanation that travels through the story.</h2><p>Return to <i>Room for the Ramp</i>. You may use a theme from the practice or propose a different theme supported by the whole story. Do not reuse the same theme with slightly different words.</p><div class=\"callout\"><b>Response recipe:</b> State the message \u2192 cite a beginning detail \u2192 explain a middle turning point \u2192 explain how the ending develops the message. Then connect the two themes.</div><label class=\"writing\">Theme 1: State a complete message and explain its development from beginning to middle to ending. Include at least two numbered paragraph references.<textarea id=\"theme1\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label><label class=\"writing\">Theme 2: State a DIFFERENT complete message. Trace its development and explain whether it is explicit or implied. Include at least two paragraph references.<textarea id=\"theme2\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label><label class=\"writing\">How do the two themes work together? Explain how the SAME event can develop both themes in different ways.<textarea id=\"connect\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label><details><summary>Stuck? Open a sentence frame.</summary><p>At first, Owen ____, suggesting ____. When ____, his decision to ____ develops the message that ____. By the ending, ____, confirming/complicating this theme because ____. This connects to the second theme because ____.</p></details><details><summary>Check your response AFTER writing</summary><ul><li>I wrote two distinct messages, not just topics.</li><li>I used evidence across the story, not only the final paragraph.</li><li>I explained HOW each detail develops a message.</li><li>I distinguished directly stated messages from inferred ones.</li><li>I explained a connection between themes.</li></ul></details>"}, {"title": "Remember & submit", "time": 3, "body": "<div class=\"question\" data-id=\"q15\" data-answer=\"1\" data-why=\"The consequence supports a transferable message. A character does not have to learn the lesson for the reader to infer it.\"><span class=\"badge\">DOK 2 \u2022 Select one</span><h3>A story ends with a character refusing to apologize and losing a trusted friend. Which statement is best supported?</h3><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"0\"> People always forgive mistakes immediately.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"1\"> Refusing to take responsibility can damage relationships.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"2\"> Apologies</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"3\"> A character loses a friend.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Exit ticket: In your own words, explain topic vs. theme and explicit vs. implied. Then list the five SCARS clues.<textarea id=\"exit\" rows=\"4\" placeholder=\"Explain your thinking using specific details from the text.\"></textarea></label><h2>Your completion report</h2><p>Check every practice question and complete the written responses. Then generate your report below. You can save/print it as a PDF or download a text copy. On an iPad, use the browser\u2019s Share/Print options to save the PDF if available, or screenshot the report. Upload the file or screenshots to Canvas.</p><button id=\"reportBtn\">My completion report</button><button id=\"downloadBtn\">Download report (.txt)</button><button id=\"printBtn\">Print / save PDF</button><div id=\"report\" aria-live=\"polite\"></div>"}];
let page=0,answers={},checks={},fields={},seconds=0;const KEY='multipleThemesTutorial_v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){page=s.page||0;answers=s.answers||{};checks=s.checks||{};fields=s.fields||{};seconds=s.seconds||0}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({page,answers,checks,fields,seconds}))}catch(e){}}
function capture(){document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>{if(!answers[el.name])answers[el.name]=[];});document.querySelectorAll('.question').forEach(el=>answers[el.dataset.id]=[...el.querySelectorAll('input:checked')].map(x=>+x.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>fields[el.id]=el.value);save()}
function render(){document.getElementById('panel').innerHTML='<span class="badge">Section '+(page+1)+' of 8</span>'+sections[page].body;document.getElementById('nav').innerHTML=sections.map((s,i)=>'<button class="'+(i===page?'current':'')+'" data-page="'+i+'">'+(i+1)+'. '+s.title+'</button>').join('');document.getElementById('progress').value=page+1;document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===7;document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>el.checked=(answers[el.name]||[]).includes(+el.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>el.value=fields[el.id]||'');document.querySelectorAll('.question').forEach(el=>{if(checks[el.dataset.id])showFeedback(el)});save()}
function showFeedback(el){const c=checks[el.dataset.id],f=el.querySelector('.feedback');f.style.display='block';f.textContent=(c.correct?'Correct. ':'Revisit this. ')+el.dataset.why+' Correct choice(s): '+el.dataset.answer.split(',').map(v=>el.querySelector('input[value="'+v+'"]').parentElement.textContent.trim()).join(' | ')}
document.addEventListener('input',e=>{if(e.target.closest('#panel')){if(e.target.name){delete checks[e.target.name];const f=e.target.closest('.question').querySelector('.feedback');f.style.display='none'}capture()}});
document.addEventListener('click',e=>{if(e.target.dataset.page!==undefined){capture();page=+e.target.dataset.page;render();window.scrollTo(0,0)}if(e.target.classList.contains('check')){capture();let el=e.target.closest('.question'),got=answers[el.dataset.id]||[],wanted=el.dataset.answer.split(',').map(Number);if(!got.length){el.querySelector('.feedback').style.display='block';el.querySelector('.feedback').textContent='Choose an answer first.';return}checks[el.dataset.id]={correct:got.length===wanted.length&&wanted.every(v=>got.includes(v))};showFeedback(el);save()}if(e.target.id==='reportBtn')makeReport();if(e.target.id==='printBtn'){makeReport();window.print()}if(e.target.id==='downloadBtn'){const txt=makeReport();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='Multiple-Themes-Completion-Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.getElementById('back').onclick=()=>{capture();page--;render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{capture();page++;render();window.scrollTo(0,0)};
function makeReport(){capture();const ids=Array.from({length:15},(_,i)=>'q'+(i+1)),written=['toolkit','guided','theme1','theme2','connect','exit'];const done=ids.filter(id=>checks[id]).length,correct=ids.filter(id=>checks[id]?.correct).length,w=written.filter(id=>(fields[id]||'').trim()).length;let t='MULTIPLE THEMES • COMPLETION REPORT\nStudent: '+(fields.student||'[Name missing]')+'\nDate: '+new Date().toLocaleString()+'\nStatus: '+(done===15&&w===6&&fields.student?.trim()?'All required fields completed':'Incomplete — review missing work')+'\nPractice checked: '+done+'/15\nCurrent correct after feedback/retries: '+correct+'/15 (practice, not mastery score)\nWritten responses: '+w+'/6 (teacher review required)\nActive page time: '+Math.floor(seconds/60)+' minutes; time is not proof of learning.\n';ids.forEach(id=>{t+='\n'+id.toUpperCase()+': '+(!checks[id]?'Not checked':checks[id].correct?'Correct':'Needs review')});written.forEach(id=>t+='\n\n'+id.toUpperCase()+':\n'+(fields[id]||'[Missing]'));document.getElementById('report').textContent=t;return t}
setInterval(()=>{if(!document.hidden){seconds++;if(seconds%10===0)save()}},1000);render();
</script></body></html>
